[project]
name = "botflow-backend"
version = "0.1.0"
description = "BotFlow backend workspace"
requires-python = ">=3.12,<3.15"
dependencies = []

[tool.uv.workspace]
members = ["libs/*", "services/*"]

# CPU-only PyTorch wheels for the optional automation-service `stt` extra.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio>=1.0,<2",
    "httpx==0.28.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
