[project]
name = "automation-service"
version = "0.1.0"
description = "BotFlow automation service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "kernel-domain",
    "kernel-platform",
    "dependency-injector==4.49.1",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "aio-pika==10.1.1",
    "httpx==0.28.1",
    "redis==8.1.0",
    "aiogram==3.31.0",
    "aioboto3==15.5.0",
]

[project.optional-dependencies]
# Local official Whisper (ADR-0006); installed explicitly, never by `make deps`.
stt = [
    "openai-whisper==20250625",
    "torch==2.14.1",
    "psutil==7.2.2",
]

[tool.uv.sources]
kernel-domain = { workspace = true }
kernel-platform = { workspace = true }
torch = { index = "pytorch-cpu", extra = "stt", marker = "sys_platform != 'darwin'" }

[tool.uv]
package = false

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:tests/unit"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
