[project]
name = "tasks-service"
version = "0.1.0"
description = "BotFlow tasks service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "botflow-platform",
    "dependency-injector==4.49.1",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "aio-pika==10.1.1",
    "httpx==0.28.1",
    "redis==8.1.0",
]

[tool.uv.sources]
botflow-platform = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botflow_tasks"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
