[project]
name = "identity-service"
version = "0.1.0"
description = "BotFlow identity service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "botflow-platform",
    "dependency-injector==4.49.1",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.5",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "aio-pika==10.1.1",
    "httpx==0.28.1",
]

[tool.uv.sources]
botflow-platform = { workspace = true }

[tool.uv]
package = false

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
