[project]
name = "botflow-platform"
version = "0.1.0"
description = "Technical adapters shared by BotFlow processes"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.156.8", "pydantic-settings==2.16.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
