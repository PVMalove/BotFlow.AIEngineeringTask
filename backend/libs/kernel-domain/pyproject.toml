[project]
name = "kernel-domain"
version = "0.1.0"
description = "Shared domain primitives for BotFlow (Result, Error, Entity, DomainEvent); stdlib only"
requires-python = ">=3.12,<3.15"
dependencies = []

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_domain"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
