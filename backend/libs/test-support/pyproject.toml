[project]
name = "test-support"
version = "0.1.0"
description = "Shared test doubles and fixtures for BotFlow backend tests"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pytest==9.1.1",
    "pytest-asyncio>=1.0,<2",
    "sqlalchemy[asyncio]==2.1.5",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_support"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true
