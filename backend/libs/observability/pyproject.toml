[project]
name = "observability"
version = "0.1.0"
description = "Request context, structured logging and access-log middleware for BotFlow services"
requires-python = ">=3.12,<3.15"
dependencies = [
    "starlette>=0.40",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
