[project]
name = "kernel-platform"
version = "0.1.0"
description = "Technical adapters shared by BotFlow processes"
requires-python = ">=3.12,<3.15"
dependencies = [
    "kernel-domain",
    "fastapi==0.156.8",
    "pydantic-settings==2.16.1",
    "dependency-injector==4.49.1",
    "sqlalchemy[asyncio]==2.1.5",
    "asyncpg==0.32.0",
    "aio-pika==10.1.1",
    "redis==8.1.0",
    "aioboto3==15.5.0",
    "alembic==1.20.0",
]

[tool.uv.sources]
kernel-domain = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
